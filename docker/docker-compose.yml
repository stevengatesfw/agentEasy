services:
  api:
    #image: ${BACK_IMAGE:-crpi-blsid77lj9a28n6f.cn-hangzhou.personal.cr.aliyuncs.com/lcagent/back:latest}
    image: easyagent-back:latest
    # registry.cn-hangzhou.aliyuncs.com/lazyllm/lazycraft-back:latest
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      !!merge <<: *lazy-env
      MODE: api
      DEBUG: 'true' # 开启开发模式,代码保存后会自动重启
      LAZYLLM_CUDA_VISIBLE: "True"
      # 配置模型缓存目录到挂载的 volume，确保容器重建后模型不丢失
      # 注意：lazyllm.config 读取的环境变量名是 LAZYLLM_MODEL_CACHE_DIR（prefix='LAZYLLM' + env='MODEL_CACHE_DIR'）
      LAZYLLM_MODEL_CACHE_DIR: /mnt/lustre/share_data/models
    depends_on:
      - db
      - redis
    networks:
      - lazycraft-network
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/upload:/app/upload
      - ./volumes/share_data:/mnt/lustre/share_data  #模型路径
      - ../back/src:/app/src:cached  # 临时挂载源代码，用于快速测试
      - ../back/LazyLLM/lazyllm:/usr/local/lib/python3.10/site-packages/lazyllm:cached  # 挂载 LazyLLM 源代码，用于快速测试
  worker:
    #image: ${BACK_IMAGE:-crpi-blsid77lj9a28n6f.cn-hangzhou.personal.cr.aliyuncs.com/lcagent/back:latest}
    image: easyagent-back:latest
    # registry.cn-hangzhou.aliyuncs.com/lazyllm/lazycraft-back:latest
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      !!merge <<: *lazy-env
      MODE: worker
      LAZYLLM_CUDA_VISIBLE: "True"
      # 配置模型缓存目录到挂载的 volume，确保容器重建后模型不丢失
      # 注意：lazyllm.config 读取的环境变量名是 LAZYLLM_MODEL_CACHE_DIR（prefix='LAZYLLM' + env='MODEL_CACHE_DIR'）
      LAZYLLM_MODEL_CACHE_DIR: /mnt/lustre/share_data/models
    depends_on:
      - db
      - redis
    networks:
      - lazycraft-network
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/upload:/app/upload
      - ./volumes/share_data:/mnt/lustre/share_data  #模型路径
      - ../back/src:/app/src:cached  # 临时挂载源代码，用于快速测试
      - ../back/LazyLLM/lazyllm:/usr/local/lib/python3.10/site-packages/lazyllm:cached  # 挂载 LazyLLM 源代码，用于快速测试
  beat:
    #image: ${BACK_IMAGE:-crpi-blsid77lj9a28n6f.cn-hangzhou.personal.cr.aliyuncs.com/lcagent/back:latest}
    image: easyagent-back:latest
    # registry.cn-hangzhou.aliyuncs.com/lazyllm/lazycraft-back:latest
    restart: always
    security_opt:
      - seccomp:unconfined
    environment:
      !!merge <<: *lazy-env
      MODE: beat
      LAZYLLM_CUDA_VISIBLE: "True"
    depends_on:
      - db
      - redis
    networks:
      - lazycraft-network
    volumes:
      - ./volumes/app/storage:/app/storage
      - ./volumes/app/upload:/app/upload
      - ./volumes/share_data:/mnt/lustre/share_data  #模型路径
      - ../back/src:/app/src:cached  # 临时挂载源代码，用于快速测试
      - ../back/LazyLLM/lazyllm:/usr/local/lib/python3.10/site-packages/lazyllm:cached  # 挂载 LazyLLM 源代码，用于快速测试
  web:
    # image: crpi-blsid77lj9a28n6f.cn-hangzhou.personal.cr.aliyuncs.com/lcagent/front:latest
    # 本地开发/自定义修复：通过源码构建前端镜像，确保修改能真正生效
    build:
      context: ../front
      dockerfile: Dockerfile
    image: easyagent-front:latest
    restart: always
    environment:
      CONSOLE_API_URL: ''
      APP_API_URL: ''
      SENTRY_DSN: ''
    networks:
      - lazycraft-network
  pd:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/pd:v8.5.0
    # pingcap/pd:v8.5.0
    restart: always
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    privileged: true
    environment:
      - PD_SERVER_NAME=pd
      - INITIAL_CLUSTER=pd=http://pd:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - TZ=Asia/Shanghai
    volumes:
      - ./volumes/pd-data:/pd
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:2379/health']
      interval: 5s
      timeout: 2s
      retries: 20
    networks:
      - lazycraft-network
    # ports:
    #   - "2379:2379"
    #   - "2380:2380"
  tikv:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/tikv:v8.5.0
    # pingcap/tikv:v8.5.0
    restart: always
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    privileged: true
    environment:
      - PD_ADDR=pd:2379
      - TZ=Asia/Shanghai
    depends_on:
      - pd
    volumes:
      - ./volumes/tikv-data:/tikv
    networks:
      - lazycraft-network
    # ports:
    #   - "20160:20160"
  db:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/tidb:v8.5.0
    # pingcap/tidb:v8.5.0
    restart: always
    cap_add:
      - SYS_ADMIN
    security_opt:
      - seccomp:unconfined
    privileged: true
    environment:
      - PATH="bin:$PATH"
      - MYSQL_HOST=0.0.0.0
      - MYSQL_PORT=4000
      - STORE=tikv
      - PATH=bin:$PATH
      - PD_ADDR=pd:2379
      - TZ=Asia/Shanghai
    depends_on:
      - tikv
      - pd
    volumes:
      - ./volumes/tidb-data:/tmp/tidb
    networks:
      - lazycraft-network
    ports:
      - "4000:4000"
  redis:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/redis:6-alpine
    # redis:6-alpine
    restart: always
    volumes:
      - ./volumes/redis/data:/data
    command: redis-server --requirepass lazyai123456
    #command: redis-server --requirepass ${REDIS_PASSWORD:-lazyai123456}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - lazycraft-network
      # ports:
      #   - "6379:6379"
  mcp-echarts-sse:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/mcp-echarts-mcp-echarts-sse:latest
    # lazyllm/mcp-echarts-mcp-echarts-sse:latest
    restart: always
    command: ["sh", "-c", "apk add --no-cache chromium nss freetype harfbuzz ca-certificates ttf-freefont && node build/index.js --transport sse --port 3033"]
    environment:
      !!merge <<: *lazy-env
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
    networks:
      - lazycraft-network
  web-search-sse: # 提供网络搜索的sse服务
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/open-web-search:v1.1.5.1
    # ghcr.io/aas-ee/open-web-search:v1.1.5.1
    working_dir: /app
    restart: always
    environment:
      NODE_ENV: production
      ENABLE_CORS: "true"
      CORS_ORIGIN: "*"
    command: ["node", "build/index.js"]
    networks:
      - lazycraft-network
  minio:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/minio:RELEASE.2025-07-23T15-54-02Z
    # minio/minio:RELEASE.2025-07-23T15-54-02Z
    restart: always
    command: server /data --console-address ":9001"
    #ports:
    # - "9000:9000"   # API 端口
    # - "9001:9001"   # 控制台端口
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 1s
    networks:
      - lazycraft-network
  init-minio:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/mc:RELEASE.2025-07-21T05-28-08Z
    # minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 $${MINIO_ACCESS_KEY} $${MINIO_SECRET_KEY} --api s3v4 &&
        mc mb myminio/mcp-echarts || true &&
        mc anonymous set download myminio/mcp-echarts &&
        echo '✅ MinIO bucket mcp-echarts is ready and public'
      "
    networks:
      - lazycraft-network
  nginx:
    image: registry.cn-hangzhou.aliyuncs.com/lazyllm/nginx:latest
    # nginx:latest
    restart: always
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/proxy.conf:/etc/nginx/proxy.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./volumes/app/upload:/app/upload # 静态文件目录，部署脚本一定要放在数据盘，和后端共享
      - /mnt/lizhipeng/nginx_ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
      - minio
    networks:
      - lazycraft-network
    ports:
      - "30382:80"
      - "30383:443"
  cloud-service:
    #image: registry.cn-hangzhou.aliyuncs.com/lazyllm/lazyllm:0.6.2
    #image: crpi-blsid77lj9a28n6f.cn-hangzhou.personal.cr.aliyuncs.com/lcagent/cloud-service:latest
    #image: lcagent-core:lightweight
    image: lcagent-core:12.8multienv
    restart: always
    ports:
      - "31340:31340"  # 暴露 AMS 服务端口
      - "31341:31341"  # 暴露 FT 服务端口
    environment:
      !!merge <<: *lazy-env
      LAZYLLM_DEFAULT_LAUNCHER: empty
      LAZYLLM_CUDA_VISIBLE: "True"
      VLLM_ENFORCE_EAGER: "true"
      VLLM_DISABLE_PLUGINS: "paddlex"
      LAZYLLM_TEMP_DIR: /mnt/lustre/share_data/temp
      LAZYLLM_INFER_LOG_ROOT: /mnt/lustre/share_data/logs/infer
      LAZYLLM_TRAIN_TARGET_ROOT: /mnt/lustre/share_data/finetune_models
      # 配置模型缓存目录到挂载的 volume，确保容器重建后模型不丢失
      # 注意：lazyllm.config 读取的环境变量名是 LAZYLLM_MODEL_CACHE_DIR（prefix='LAZYLLM' + env='MODEL_CACHE_DIR'）
      LAZYLLM_MODEL_CACHE_DIR: /mnt/lustre/share_data/models
      # 配置 MODEL_PATH 以支持模型共享：包含模型库存储路径和默认缓存路径
      # 多个路径用 : 分隔，ModelManager 会按顺序查找
      LAZYLLM_MODEL_PATH: /mnt/lustre/share_data/models:/mnt/lustre/share_data/lazycraft/exist_model/models_hub
    entrypoint: >
      /bin/bash -lc "
        # 安装兼容的 PyTorch 2.9.0、vllm 0.11.1 和 flash-attn
        python -c 'import torch; import vllm; torch_ok = torch.__version__.startswith(\"2.9.0\"); vllm_ok = vllm.__version__.startswith(\"0.11.1\"); exit(0 if (torch_ok and vllm_ok) else 1)' 2>/dev/null || (
          echo 'Fixing PyTorch, vllm, and flash-attn versions for compatibility...' &&
          # 安装 PyTorch 2.9.0+cu126（vllm 0.11.1 要求，使用镜像源）
          python -c 'import torch; version = torch.__version__; expected = \"2.9.0\"; exit(0 if version.startswith(expected) else 1)' 2>/dev/null || (
            echo 'Installing PyTorch 2.9.0+cu126 from mirror...' &&
            pip install --quiet --no-cache-dir 'torch==2.9.0+cu126' 'torchvision==0.24.0+cu126' 'torchaudio==2.9.0+cu126' --index-url https://mirrors.nju.edu.cn/pytorch/whl/cu126 2>&1 | grep -v '^WARNING' | tail -3 || true
          ) &&
          # 安装 vllm 0.11.1（支持 deepseek_ocr 和 PyTorch 2.9.0）
          python -c 'import vllm; version = vllm.__version__; expected = \"0.11.1\"; exit(0 if version.startswith(expected) else 1)' 2>/dev/null || (
            echo 'Installing vllm 0.11.1 (compatible with PyTorch 2.9.0)...' &&
            pip uninstall -y vllm 2>/dev/null || true &&
            pip install --quiet --no-cache-dir 'vllm==0.11.1' 2>&1 | grep -v '^WARNING' | tail -3 || true
          ) &&
          # 从源码编译安装 flash-attn 以匹配 PyTorch 2.9.0（需要 CUDA 12.6 工具包和 ninja）
          python -c 'import flash_attn; from flash_attn import flash_attn_varlen_func' 2>/dev/null || (
            echo 'Compiling flash-attn from source for PyTorch 2.9.0...' &&
            pip uninstall -y flash-attn 2>/dev/null || true &&
            # 安装编译依赖
            pip install --quiet --no-cache-dir ninja packaging 2>&1 | tail -2 || true &&
            # 确保 CUDA 环境变量正确设置
            export CUDA_HOME=/usr/local/cuda-12.6 && export PATH=$CUDA_HOME/bin:$PATH && export LD_LIBRARY_PATH=$CUDA_HOME/lib64:$LD_LIBRARY_PATH && export CPATH=$CUDA_HOME/include:$CPATH &&
            pip install --no-build-isolation --no-cache-dir 'git+https://github.com/Dao-AILab/flash-attention.git' 2>&1 | tail -20 || echo 'Warning: flash-attn compilation may have failed, but continuing...'
          ) &&
          # 安装 deepseek_vl 模块及其依赖（用于 v1 服务）
          python -c 'import deepseek_vl; from attrdict import AttrDict' 2>/dev/null || (
            echo 'Installing deepseek_vl and attrdict3 for DeepSeek-VL models...' &&
            pip install --no-cache-dir attrdict3 2>&1 | tail -3 || true &&
            # 创建 attrdict 兼容层（attrdict3 兼容 Python 3.10+）
            python -c 'import attrdict3; open(\"/usr/local/lib/python3.10/dist-packages/attrdict.py\", \"w\").write(\"from attrdict3 import *\\nfrom attrdict3 import AttrDict\\n\")' 2>/dev/null || true &&
            pip install --no-cache-dir 'git+https://bgithub.xyz/deepseek-ai/DeepSeek-VL.git@main#egg=deepseek_vl' --no-deps 2>&1 | tail -5 || echo 'Warning: deepseek_vl installation may have failed, but continuing...'
          ) &&
          # 安装最新版本的 diffusers 以支持 Z-Image（需要从 GitHub 安装，使用代理）
          python -c 'from diffusers import ZImagePipeline' 2>/dev/null || (
            echo 'Installing latest diffusers from GitHub for Z-Image support...' &&
            pip install --upgrade --no-cache-dir 'git+https://githubproxy.cc/https://github.com/huggingface/diffusers' 2>&1 | tail -10 || echo 'Warning: diffusers installation may have failed, but continuing...' &&
            pip install --upgrade --no-cache-dir 'peft>=0.17.0' 2>&1 | tail -5 || echo 'Warning: peft upgrade may have failed, but continuing...'
          )
        ) &&
        /usr/bin/python -c 'import lazyllm; from lazyllm.tools.infer_service.serve import InferServer; from lazyllm.tools.train_service.serve import TrainServer; inference_service = lazyllm.ServerModule(InferServer(), port=\"31340\", launcher=lazyllm.launcher.EmptyLauncher(sync=False, ngpus=0)); inference_service.start()(); train_service = lazyllm.ServerModule(TrainServer(), port=\"31341\", launcher=lazyllm.launcher.EmptyLauncher(sync=False, ngpus=0)); train_service.start()(); inference_service.wait(); train_service.wait()' &&
        tail -f /dev/null
      "        
    volumes:
