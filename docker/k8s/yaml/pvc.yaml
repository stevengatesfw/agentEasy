apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: lcagent-storage
  namespace: lcagentns-app
spec:
  accessModes:
    - ReadWriteOnce  # 注意：local-path 只支持 RWO，不支持 RWX。如果确实需要多 Pod 共享，请使用 NFS
  resources:
    requests:
      storage: 100Gi  # 根据实际需求调整
  storageClassName: "local-path"  # 使用本地路径存储类，如果未安装请先安装 local-path-provisioner
---
