    spec:
      securityContext:
        runAsUser: 0
      containers:
      - name: worker
        image: easyagent-back:latest
        imagePullPolicy: IfNotPresent
        envFrom:
        - configMapRef:
            name: lcagent-config
        - secretRef:
            name: lcagent-secrets
        env:
        - name: MODE
          value: "worker"
        - name: LAZYLLM_CUDA_VISIBLE
          value: "True"
        - name: LAZYLLM_MODEL_CACHE_DIR
          value: "/mnt/lustre/share_data/models"
        volumeMounts:
        - name: storage
          mountPath: /app/storage
        - name: upload
          mountPath: /app/upload
        - name: share-data
