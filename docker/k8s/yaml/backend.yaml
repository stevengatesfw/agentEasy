---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: lcagentns-app
spec:
  selector:
    app: worker
  ports:
  - port: 8088
    targetPort: 8088
    name: http
  # Worker 通常不需要对外暴露端口，但 Kubernetes 要求必须有 ports 定义
---
