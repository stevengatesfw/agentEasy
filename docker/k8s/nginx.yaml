apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: lcagentns-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: registry.cn-hangzhou.aliyuncs.com/lazyllm/nginx:latest
        ports:
        - containerPort: 80
          name: http
        - containerPort: 443
          name: https
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
        - name: nginx-proxy-config
          mountPath: /etc/nginx/proxy.conf
          subPath: proxy.conf
        - name: nginx-conf-d
          mountPath: /etc/nginx/conf.d
        - name: upload
          mountPath: /app/upload
        - name: ssl-certs
          mountPath: /etc/nginx/ssl
          readOnly: true
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: nginx-proxy-config
        configMap:
          name: nginx-proxy-config
      - name: nginx-conf-d
        configMap:
          name: nginx-conf-d
      - name: upload
        persistentVolumeClaim:
          claimName: lcagent-upload
      - name: ssl-certs
        # 如果使用 Secret 存储 SSL 证书
        # secret:
        #   secretName: nginx-ssl-certs
        # 或者使用 hostPath（仅用于开发环境）
        hostPath:
          path: /mnt/lizhipeng/nginx_ssl
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: lcagentns-app
spec:
  selector:
    app: nginx
  type: NodePort
  ports:
  - port: 80
    targetPort: 80
    name: http
    nodePort: 30386  # 使用不同的端口，避免与 Docker Compose 冲突（Docker Compose 使用 30382）
  - port: 443
    targetPort: 443
    name: https
    nodePort: 30387  # 使用不同的端口，避免与 Docker Compose 冲突（Docker Compose 使用 30383）
---
# Nginx ConfigMaps
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: lcagentns-app
data:
  nginx.conf: |
    user  nginx;
    worker_processes  auto;

    error_log  /var/log/nginx/error.log notice;
    pid        /var/run/nginx.pid;

    events {
        worker_connections  1024;
    }

    http {
        include       /etc/nginx/mime.types;
        default_type  application/octet-stream;

        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for"';

        access_log  /var/log/nginx/access.log  main;

        sendfile        on;
        keepalive_timeout  65;

        client_max_body_size 500M;
        server_tokens off;

        include /etc/nginx/conf.d/*.conf;
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-proxy-config
  namespace: lcagentns-app
data:
  proxy.conf: |
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-conf-d
  namespace: lcagentns-app
data:
  default.conf: |
    map $request_filename $content_disposition {
        ~*\.pdf$     "";
        default      "attachment";
    }

    server {
        listen 80;
        server_name _;
        charset utf-8;

        location /static/upload/ {
            alias /app/upload/;
            expires 30d;
            sendfile on;
            client_max_body_size 500M;
            add_header Access-Control-Allow-Origin * always;
            add_header Content-Disposition $content_disposition always;

            if ($request_filename ~* \.pdf$) {
                add_header Content-Type "application/pdf" always;
            }
        }
        location ~ ^/(console/api|upload|api|v1|files|inspect|openapi) {
            proxy_pass http://api:8087;
            include /etc/nginx/proxy.conf;
        }
        
        location ~ ^/(model_hub|ws) {
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_pass http://api:8087;
          include /etc/nginx/proxy.conf;
        }
        
        location /studio/gateway/v1/ {
          proxy_pass https://maas.sensecore.dev/studio/gateway/v1/;
          proxy_ssl_verify off;
          proxy_set_header Host maas.sensecore.dev;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
        }
        # MCP ECharts service
        location /mcp-echarts {
            proxy_pass http://minio:9000;
            include /etc/nginx/proxy.conf;
        }
        location / {
          proxy_pass http://web:8088;
          include /etc/nginx/proxy.conf;
          # 防止浏览器/代理缓存 HTML，避免前端更新后仍加载旧页面导致"修复不生效/历史为空"
          add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
          add_header Pragma "no-cache" always;
        }
        # Error pages
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

